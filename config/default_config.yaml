# Configuration for traffic patterns and models
traffic_patterns:
  rush_hours:
    morning: [7, 8, 9]
    evening: [16, 17, 18]
  
  seasonal_factors:
    winter_reduction: 0.8
    summer_increase: 1.1
  
  event_multipliers:
    sports_events: 1.5
    concerts: 1.3
    festivals: 1.4

model_config:
  lstm:
    hidden_size: 128
    num_layers: 2
    dropout: 0.2
  
  gru:
    hidden_size: 128
    num_layers: 2
    dropout: 0.2
  
  attention_lstm:
    hidden_size: 128
    num_layers: 2
    dropout: 0.2

training_config:
  batch_size: 32
  epochs: 50
  learning_rate: 0.001
  validation_split: 0.2
  early_stopping_patience: 10

forecasting:
  sequence_length: 168  # 1 week
  forecast_horizon: 24   # 24 hours
  confidence_interval: 0.95
